<div class="pe-site" data-page="AdminPages" id="pe-site-root">
<header class="pe-top">
    <button type="button" class="pe-burger" aria-label="Menu" onclick="AdminPagesJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="pe-logo" href="Admin"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#13202B"/><path d="M12 30L18 10M28 30L22 10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/><path d="M20 13v3M20 20v3M20 27v2" fill="none" stroke="#E2622B" stroke-width="2.6" stroke-linecap="round"/></svg><span id="pe-brand">Staff</span><small>Staff</small></a>
    <div class="pe-who" id="pe-who"></div>
    <a class="pe-tl pe-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="pe-tl" onclick="AdminPagesJs.signout()">Sign out</button>
</header>
<div class="pe-body">
    <nav class="pe-rail" id="pe-rail" aria-label="Staff menu">
        <div class="pe-rail-top"><b>Menu</b><button type="button" class="pe-ibtn" aria-label="Close menu" onclick="AdminPagesJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="pe-menu" id="pe-menu"></div>
    </nav>
    <div class="pe-scrim" id="pe-scrim" onclick="AdminPagesJs.closeMenu()"></div>
    <main class="pe-main" id="pe-main"><div class="pe-loading">Loading</div></main>
</div>
<div class="pe-modal" id="pe-modal" aria-hidden="true">
    <div class="pe-mbox" role="dialog" aria-modal="true" aria-labelledby="pe-mtitle">
        <div class="pe-mhead"><h2 id="pe-mtitle"></h2><button type="button" class="pe-ibtn" aria-label="Close" onclick="AdminPagesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="pe-mbody" id="pe-mbody"></div>
    </div>
</div>
<div class="pe-pk" id="pe-pk" aria-hidden="true">
    <div class="pe-mbox pe-pkbox" role="dialog" aria-modal="true" aria-labelledby="pe-pkt">
        <div class="pe-mhead"><h2 id="pe-pkt">Choose from the media library</h2><button type="button" class="pe-ibtn" aria-label="Close" onclick="AdminPagesJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="pe-mbody">
            <div class="pe-pkbar"><input type="search" id="pe-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminPagesJs.pkSearch()" aria-label="Search media"><select id="pe-pkkind" aria-label="Type" onchange="AdminPagesJs.pkList()"><option value="">Photos and videos</option><option value="photo">Photos</option><option value="video">Videos</option></select><label class="pe-btn pe-btn-ghost pe-btn-sm pe-upbtn" id="pe-pkupl"><input type="file" id="pe-pkfile" multiple onchange="AdminPagesJs.pkUpload()">Upload new</label></div>
            <p class="pe-upmsg" id="pe-pkmsg" role="status"></p>
            <div class="pe-pkgrid" id="pe-pkgrid"></div>
        </div>
    </div>
</div>
<div class="pe-toast" id="pe-toast" role="status" aria-live="polite"></div>
</div>
