<div class="dk-site" data-page="AdminDesk" id="dk-site-root">
<header class="dk-top">
    <button type="button" class="dk-burger" aria-label="Menu" onclick="AdminDeskJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="dk-logo" href="Admin"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#13202B"/><path d="M12 30L18 10M28 30L22 10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/><path d="M20 13v3M20 20v3M20 27v2" fill="none" stroke="#E2622B" stroke-width="2.6" stroke-linecap="round"/></svg><span id="dk-brand">Staff</span><small>Staff</small></a>
    <div class="dk-who" id="dk-who"></div>
    <a class="dk-tl dk-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="dk-tl" onclick="AdminDeskJs.signout()">Sign out</button>
</header>
<div class="dk-body">
    <nav class="dk-rail" id="dk-rail" aria-label="Staff menu">
        <div class="dk-rail-top"><b>Menu</b><button type="button" class="dk-ibtn" aria-label="Close menu" onclick="AdminDeskJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="dk-menu" id="dk-menu"></div>
    </nav>
    <div class="dk-scrim" id="dk-scrim" onclick="AdminDeskJs.closeMenu()"></div>
    <main class="dk-main" id="dk-main"><div class="dk-loading">Loading</div></main>
</div>
<div class="dk-modal" id="dk-modal" aria-hidden="true">
    <div class="dk-mbox dk-wide" role="dialog" aria-modal="true" aria-labelledby="dk-mtitle">
        <div class="dk-mhead"><h2 id="dk-mtitle"></h2><button type="button" class="dk-ibtn" aria-label="Close" onclick="AdminDeskJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="dk-mbody" id="dk-mbody"></div>
    </div>
</div>
<div class="dk-pk" id="dk-pk" aria-hidden="true">
    <div class="dk-mbox dk-pkbox" role="dialog" aria-modal="true" aria-labelledby="dk-pkt">
        <div class="dk-mhead"><h2 id="dk-pkt">Choose from the media library</h2><button type="button" class="dk-ibtn" aria-label="Close" onclick="AdminDeskJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="dk-mbody">
            <div class="dk-pkbar"><input type="search" id="dk-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminDeskJs.pkSearch()" aria-label="Search media"><label class="dk-btn dk-btn-ghost dk-btn-sm dk-upbtn"><input type="file" id="dk-pkfile" accept="image/jpeg,image/png,image/webp,image/gif" onchange="AdminDeskJs.pkUpload()">Upload new</label></div>
            <p class="dk-upmsg" id="dk-pkmsg" role="status"></p>
            <div class="dk-pkgrid" id="dk-pkgrid"></div>
        </div>
    </div>
</div>
<div class="dk-toast" id="dk-toast" role="status" aria-live="polite"></div>
</div>
