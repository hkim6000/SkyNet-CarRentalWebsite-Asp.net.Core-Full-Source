<div class="ic-site" data-page="AdminIncidents" id="ic-site-root">
<header class="ic-top">
    <button type="button" class="ic-burger" aria-label="Menu" onclick="AdminIncidentsJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ic-logo" href="Admin"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#13202B"/><path d="M12 30L18 10M28 30L22 10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/><path d="M20 13v3M20 20v3M20 27v2" fill="none" stroke="#E2622B" stroke-width="2.6" stroke-linecap="round"/></svg><span id="ic-brand">Staff</span><small>Staff</small></a>
    <div class="ic-who" id="ic-who"></div>
    <a class="ic-tl ic-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ic-tl" onclick="AdminIncidentsJs.signout()">Sign out</button>
</header>
<div class="ic-body">
    <nav class="ic-rail" id="ic-rail" aria-label="Staff menu">
        <div class="ic-rail-top"><b>Menu</b><button type="button" class="ic-ibtn" aria-label="Close menu" onclick="AdminIncidentsJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="ic-menu" id="ic-menu"></div>
    </nav>
    <div class="ic-scrim" id="ic-scrim" onclick="AdminIncidentsJs.closeMenu()"></div>
    <main class="ic-main" id="ic-main"><div class="ic-loading">Loading</div></main>
</div>
<div class="ic-modal" id="ic-modal" aria-hidden="true">
    <div class="ic-mbox ic-wide" role="dialog" aria-modal="true" aria-labelledby="ic-mtitle">
        <div class="ic-mhead"><h2 id="ic-mtitle"></h2><button type="button" class="ic-ibtn" aria-label="Close" onclick="AdminIncidentsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="ic-mbody" id="ic-mbody"></div>
    </div>
</div>
<div class="ic-pk" id="ic-pk" aria-hidden="true">
    <div class="ic-mbox ic-pkbox" role="dialog" aria-modal="true" aria-labelledby="ic-pkt">
        <div class="ic-mhead"><h2 id="ic-pkt">Choose from the media library</h2><button type="button" class="ic-ibtn" aria-label="Close" onclick="AdminIncidentsJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="ic-mbody">
            <div class="ic-pkbar"><input type="search" id="ic-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminIncidentsJs.pkSearch()" aria-label="Search media"><label class="ic-btn ic-btn-ghost ic-btn-sm ic-upbtn"><input type="file" id="ic-pkfile" accept="image/jpeg,image/png,image/webp,image/gif" onchange="AdminIncidentsJs.pkUpload()">Upload new</label></div>
            <p class="ic-upmsg" id="ic-pkmsg" role="status"></p>
            <div class="ic-pkgrid" id="ic-pkgrid"></div>
        </div>
    </div>
</div>
<div class="ic-toast" id="ic-toast" role="status" aria-live="polite"></div>
</div>
